{{- $js := resources.Get "js/copy-code.js" -}}
{{- if ne hugo.Environment "development" -}}
  {{- $js = $js | js.Build (dict "minify" true) | fingerprint -}}
{{- else -}}
  {{- $js = $js | js.Build (dict "minify" false) -}}
{{- end -}}
<script defer src="{{ $js.RelPermalink }}"{{ if ne hugo.Environment "development" }} integrity="{{ $js.Data.Integrity }}"{{ end }}></script>
