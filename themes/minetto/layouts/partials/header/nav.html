<nav>
  <ul class="px-4 lg:px-0">
    {{ $currentPage := . }}
    {{ range site.Menus.main }}
      {{- $item := (cond (strings.HasSuffix .URL "/") .URL (printf "%s/" .URL)) | absLangURL -}}
      {{- $page := $currentPage.Permalink | absLangURL -}}
      <li>
        <a href="{{ .URL }}" class="{{ if eq $item $page }}active{{ end }}">{{ .Name }}</a>
      </li>
    {{ end }}
    <li class="-mt-2 block lg:hidden">
      {{ partial "header/theme-button" . }}
    </li>
  </ul>
</nav>
